name: Publish images

# Builds the image and pushes it to ghcr.io, so the server pulls instead of
# building — `next build` does not fit comfortably in the 2 GB the deployment
# target has.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build only proves an image was produced. This proves it starts,
      # that the migrate bundle resolves everything it needs, and that the dev
      # dependencies really did stay out.
      - name: Smoke-test what was published
        run: |
          APP=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker pull -q "$APP"

          docker run --rm --entrypoint sh "$APP" -c '
            test -f server.js   || { echo "  server.js missing";  exit 1; }
            test -f migrate.mjs || { echo "  migrate.mjs missing"; exit 1; }
            echo "  server.js and migrate.mjs present"
            echo "  migrations bundled: $(ls drizzle/*.sql | wc -l)"
            echo "  runs as uid $(id -u)"
            echo "  node $(node --version)"

            test -d node_modules/drizzle-kit && { echo "  dev deps leaked in"; exit 1; }
            echo "  no dev dependencies"

            # Imports are hoisted, so reaching the DATABASE_URL check means every
            # import resolved — including @node-rs/argon2, which is deliberately
            # left external and has to come from the standalone output.
            out=$(node migrate.mjs 2>&1 || true)
            case "$out" in
              *"DATABASE_URL is not set"*) echo "  migrate bundle loads and resolves" ;;
              *) echo "  migrate bundle is broken: $out"; exit 1 ;;
            esac
          '

      # The checks above never start the server. This one does, the way the VM
      # does: against an empty Postgres, so the migrations and the first user
      # run for real before the API answers. /meta is what the phone asks
      # first; /me proves the database behind it is there.
      - name: Start it and ask the API
        run: |
          APP=ghcr.io/${{ github.repository }}:${{ github.sha }}
          NAME=${GITHUB_REPOSITORY#*/}

          docker network create smoke >/dev/null
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=smoke -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=smoke \
            postgres:16-alpine >/dev/null

          # Over TCP: during its first start the image runs a socket-only server
          # that answers a plain pg_isready and is then restarted.
          for i in $(seq 1 30); do
            docker exec smoke-db pg_isready -q -h 127.0.0.1 -U smoke && break
            sleep 1
          done

          docker run -d --name smoke-app --network smoke -p 127.0.0.1:3000:3000 \
            -e DATABASE_URL=postgres://smoke:smoke@smoke-db:5432/smoke \
            -e SESSION_SECRET=smoke-test-only-not-a-real-secret \
            -e ADMIN_PASSWORD=smoke-test-only \
            -e AUTH_DISABLED=true \
            -e ORIGIN=http://localhost:3000 \
            "$APP" >/dev/null

          fail() {
            echo "  $1"
            echo "--- app log"
            docker logs smoke-app 2>&1 | tail -50
            exit 1
          }

          meta=""
          for i in $(seq 1 60); do
            meta=$(curl -fsS http://127.0.0.1:3000/api/v1/meta 2>/dev/null) && break
            [ "$(docker inspect -f '{{.State.Running}}' smoke-app)" = true ] || fail "the container exited"
            sleep 1
          done
          [ -n "$meta" ] || fail "/api/v1/meta never answered"
          echo "$meta" | jq -e --arg name "$NAME" '.app == $name and .apiVersion == 1' >/dev/null \
            || fail "/api/v1/meta answered something else: $meta"
          echo "  /api/v1/meta answers as $NAME, API version 1"

          me=$(curl -fsS http://127.0.0.1:3000/api/v1/me) || fail "/api/v1/me failed"
          echo "$me" | jq -e '.username == "admin"' >/dev/null || fail "/api/v1/me answered: $me"
          echo "  migrations ran and /api/v1/me reads the first user"

      - name: Stop the test containers
        if: always()
        run: docker rm -f smoke-app smoke-db >/dev/null 2>&1 || true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}:latest"
            echo '```'
            echo
            echo "Deploy with \`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
